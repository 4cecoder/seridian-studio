# DAW Graphics Configuration
# Similar to game settings (graphics.ini, settings.cfg)

[Display]
# Backend: auto, x11, wayland
# x11 = Required for this system (GTK4 compiled without Wayland support)
backend=x11

[Graphics]
# Renderer: gl, cairo, vulkan, ngl
# gl = OpenGL (recommended for NVIDIA)
# cairo = Software rendering (fallback)
# vulkan = Vulkan (experimental, unstable on NVIDIA)
# ngl = Next-gen GL (GTK 4.14+)
renderer=gl

# VSync: on, off, adaptive
# on = Cap to display refresh rate
# off = Uncapped (may cause tearing)
# adaptive = G-Sync/FreeSync
vsync=adaptive

# GPU: nvidia, amd, intel, auto
gpu=nvidia

[Performance]
# Reduce unnecessary redraws
optimize_redraws=true

# Visibility culling for timeline
enable_culling=true

# Batch cairo operations
batch_rendering=true

[Debug]
# Show backend info on launch
show_backend_info=true

# Enable GTK debug output
gtk_debug=false

# Cairo error reporting
cairo_errors=true
