# Keyboard key-name tables (`.key = raven.R_KEY_F9`) look like `key = value` to
# the generic-api-key rule. These two files hold only such tables.
[extend]
useDefault = true

[allowlist]
description = "Key-name tables in the Raven Zig port"
paths = [
  '''vendor/raven/zig/src/widgets/menu\.zig''',
  '''vendor/raven/zig/src/platform/x11/x11_platform\.zig''',
]
