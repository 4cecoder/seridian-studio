name: Release

# Push a tag such as v0.2.0 to publish a build. `seridian update` installs the
# latest non-prerelease release published here.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  ZIG_VERSION: 0.18.0-dev.738+ae9a8acc7

jobs:
  linux:
    name: Linux x86_64 release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake ninja-build libx11-dev libvulkan1 libpulse-dev libpipewire-0.3-dev libasound2-dev

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Unit tests
        run: zig build test

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Package
        run: |
          set -euo pipefail
          name="seridian-studio-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp -a zig-out/bin zig-out/lib LICENSE THIRD_PARTY_NOTICES.md "$name"/
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes seridian-studio-*.tar.gz seridian-studio-*.tar.gz.sha256
